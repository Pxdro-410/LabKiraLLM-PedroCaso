services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodapp}
      POSTGRES_USER: ${POSTGRES_USER:-fooduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodpass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fooduser} -d ${POSTGRES_DB:-foodapp}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fooduser}:${POSTGRES_PASSWORD:-foodpass}@db:5432/${POSTGRES_DB:-foodapp}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      MAX_RETRIES: 10
      RETRY_INTERVAL: 5
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
